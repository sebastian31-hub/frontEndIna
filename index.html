<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BurgerByte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">
                🍔 BurgerCore
            </span>
            <div class="dropdown">
                <button class="btn btn-outline-light position-relative" data-bs-toggle="dropdown">
                    🛒 Carrito
                    <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                        0
                    </span>
                </button>
                <div id="carrito-dropdown-menu" class="dropdown-menu dropdown-menu-end p-3" style="width: 320px; max-height: 450px; overflow-y: auto;">
                    <ul id="carrito" class="list-group list-group-flush mb-3">
                        <li class="text-center text-muted list-group-item border-0">
                            Carrito vacío
                        </li>
                    </ul>
                    <div id="carrito-acciones" class="d-none">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <strong>Total:</strong>
                            <span class="fw-bold text-success">$<span id="total">0</span></span>
                        </div>
                        <div class="d-grid gap-2">
                            <button id="btn-comprar" class="btn btn-success btn-sm">Finalizar Compra</button>
                            <button id="btn-vaciar" class="btn btn-outline-danger btn-sm">Vaciar Carrito</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h1 class="text-center mb-4">Nuestros Combos</h1>
        <div id="productos" class="row"></div>

        <hr class="my-5">
        
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <h2>Feedback del Cliente</h2>
                <form id="feedbackForm" class="mt-3">
                    <input id="nombre" class="form-control mb-2" placeholder="Nombre">
                    <input id="correo" class="form-control mb-2" placeholder="Correo">
                    <textarea id="comentario" class="form-control mb-2" placeholder="¿Cómo estuvo tu hamburguesa?" rows="3"></textarea>
                    <select id="calificacion" class="form-control mb-2">
                        <option value="">Calificación</option>
                        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
                    </select>
                    <button class="btn btn-success w-100">Enviar comentario</button>
                </form>
                <div id="mensaje" class="mt-3"></div>
            </div>
        </div>
    </div>

    <footer class="footer-custom mt-5">
        <div class="container text-center">
            <p><strong>BurgerByte</strong> - Proyecto Programación Frontend 2026</p>
            <p>© 2026 Todos los derechos reservados</p>
            <button id="temaBtn" class="btn btn-sm btn-outline-light">Cambiar tema</button>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
